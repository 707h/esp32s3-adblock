[platformio]
default_envs = s3_16mb

[env]
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ---------------------------------------------------------------------------
; ESP32-S3, 16 MB flash (N16R8 / N16R2 / bare 16 MB).  PSRAM optional / unused.
; Two 3 MB OTA slots + 9.9 MB LittleFS (~2M domains at 5 B/hash).
; ---------------------------------------------------------------------------
[env:s3_16mb]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_s3_16mb.csv
upload_speed = 460800
build_flags =
    ; ---- Serial routing ----
    ; This board is wired to a CH343 USB-UART bridge on UART0 (GPIO43/44), not to
    ; the S3's native USB-JTAG pins. With ARDUINO_USB_CDC_ON_BOOT=0 the core puts
    ; `Serial` on UART0, which is what the CH343 actually sees. ARDUINO_USB_MODE=1
    ; still compiles the native USB-CDC in, exposed as `USBSerial` for boards that
    ; do have the native port wired. Uploads always go over the ROM download stub
    ; on UART0, so flashing is unaffected.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DINDEX_ENTRIES=8192
    -DMAX_RANGE=256
    -DUPSTREAM_IP=223,5,5,5

; ---------------------------------------------------------------------------
; ESP32-S3, 8 MB flash.  Two 1.5 MB OTA slots + 5 MB LittleFS (~1M domains).
; ---------------------------------------------------------------------------
[env:s3_8mb]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions_s3_8mb.csv
upload_speed = 460800
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DINDEX_ENTRIES=8192
    -DMAX_RANGE=256
    -DUPSTREAM_IP=223,5,5,5

; ---------------------------------------------------------------------------
; ESP32-S3, 4 MB flash.  One app slot (no firmware OTA) + 2.4 MB LittleFS.
; Uses the smaller 4096-entry index so static RAM stays comfortable.
; ---------------------------------------------------------------------------
[env:s3_4mb]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions_s3_4mb.csv
upload_speed = 460800
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DINDEX_ENTRIES=4096
    -DMAX_RANGE=256
    -DUPSTREAM_IP=223,5,5,5

; ---------------------------------------------------------------------------
; Reference build kept from upstream (same firmware, C3 4 MB board).
; ---------------------------------------------------------------------------
[env:c3]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
board_build.partitions = partitions_c3_4mb.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUPSTREAM_IP=223,5,5,5
